# Internal Cron Scheduler — GitHub Actions replacement for the 17
# sub-daily Vercel crons that no longer fit in vercel.json (P5D-VERCEL-FIX).
#
# Vercel's Hobby plan rejects any cron expression that runs more than
# once per day at DEPLOY time (see docs/PUBLIC_TEST_RUNBOOK.md and the
# P5D-VERCEL-CRON-D/P5D-VERCEL-FIX phase reports for the full
# investigation). Every route below previously ran as a Vercel Cron
# entry at its EXACT current cadence; only the trigger mechanism moves,
# never the schedule, the route implementation, or its authentication
# contract. `advertising/purge-events` (already once-daily) deliberately
# stays in vercel.json and is NOT duplicated here (see the "purge"
# guard in the dispatch table below).
#
# Follows the exact authenticated-invocation pattern already proven live
# by kyc-upload-intent-cleanup.yml: one bounded, authenticated HTTPS POST
# per route per tick, no repository checkout, no write permissions, no
# Supabase access, no caller-controlled parameters. That workflow is left
# untouched — this is a separate file for a separate set of routes.
#
# Exactly ONE request per route per tick, deliberately, never a retry
# (P5D-VERCEL-FIX.1). A read-only review proved this is the only policy
# safe across all 17 heterogeneous routes: several have no protection
# against a genuinely concurrent second invocation of the SAME route
# (e.g. expire-marketplace-requests writes marketplace_request_history
# via an unlocked read-then-update with no re-check in the UPDATE's own
# WHERE clause; email/retry-failed's retryDelivery() does an unlocked
# status check before sending) -- a scheduler-level retry issued while
# the first attempt's mutation may already be in flight server-side
# (the request timing out client-side does not mean the server stopped
# running) could double-write history or double-send an email for those
# specific routes. Ambiguous-completion policy: if a request's outcome
# is unknown (timeout, transport failure, or a 5xx that might mean the
# server already committed), this workflow marks that route's tick
# failed and moves on -- it never repeats the request. A route that
# needs its own retry semantics implements them inside its own durable
# business logic, not here.
#
# Each internal route already accepts EITHER of two secrets
# (src/lib/internal-cron/auth.ts): CRON_SECRET (Vercel Cron's own,
# platform-attached) or INTERNAL_CRON_SECRET (this codebase's existing
# manual/curl convention, used here — the same one KYC's workflow uses).
#
# Base URL, not 17 individual endpoint secrets: KYC's workflow stores one
# full endpoint URL as a variable because it only ever calls one route.
# This workflow calls 17 routes on the same host, so it stores ONE base
# URL (INTERNAL_CRON_BASE_URL, a GitHub Actions variable — not a secret,
# since a route's path is already public in this repository) and appends
# each route's fixed, non-secret path. This is the narrowest convention
# that still avoids declaring 17 near-duplicate variables.
#
# Multiple routes intentionally share the same cron expression exactly
# as they did in vercel.json (e.g. "0 * * * *" fires both
# reviews/process-deadlines and affiliate/review-and-approve). Dispatch
# below is by exact string equality against github.event.schedule, never
# a glob/case match (cron expressions contain "*", which a shell `case`
# would otherwise interpret as a glob) -- every route mapped to a firing
# schedule is invoked, and one route's failure never skips another's
# attempt (see the dispatch loop at the end of the run step below).
#
# Scheduled workflows run ONLY from this file on the repository's
# default branch.

name: Internal Cron Scheduler

on:
  schedule:
    - cron: '0 * * * *'
    - cron: '*/10 * * * *'
    - cron: '*/20 * * * *'
    - cron: '10 * * * *'
    - cron: '15 * * * *'
    - cron: '30 * * * *'
    - cron: '0 */4 * * *'
    - cron: '20 * * * *'
    - cron: '5 * * * *'
    - cron: '10 */6 * * *'
    - cron: '40 * * * *'
    - cron: '50 * * * *'
    - cron: '45 * * * *'
    - cron: '0 */2 * * *'

# Least privilege: this workflow only makes outbound HTTPS requests.
permissions: {}

# Serialize overlapping runs of the SAME schedule only -- a slow */10
# run must not be cancelled by the next tick, but it must also not block
# an unrelated schedule (e.g. the hourly group) from firing on time.
concurrency:
  group: internal-cron-scheduler-${{ github.event.schedule }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Invoke due internal cron routes
    runs-on: ubuntu-latest
    # 300s -- same budget as kyc-upload-intent-cleanup.yml. Exactly one
    # request per route, no retry: the worst case is two routes sharing a
    # schedule at 120s max-time each, well under budget.
    timeout-minutes: 5
    steps:
      - name: Invoke routes due for this schedule
        env:
          INTERNAL_CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
          INTERNAL_CRON_BASE_URL: ${{ vars.INTERNAL_CRON_BASE_URL }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail

          # --- Required configuration -------------------------------------------------
          if [ -z "${INTERNAL_CRON_SECRET:-}" ]; then
            echo "Required GitHub Actions secret INTERNAL_CRON_SECRET is not configured."
            exit 1
          fi
          if [ -z "${INTERNAL_CRON_BASE_URL:-}" ]; then
            echo "Required GitHub Actions variable INTERNAL_CRON_BASE_URL is not configured."
            exit 1
          fi
          case "${INTERNAL_CRON_BASE_URL}" in
            https://*) ;;
            *)
              echo "INTERNAL_CRON_BASE_URL must be an https:// URL. Refusing to proceed."
              exit 1
              ;;
          esac
          if [ -z "${SCHEDULE:-}" ]; then
            echo "github.event.schedule was empty -- this workflow is schedule-triggered only. Refusing to proceed."
            exit 1
          fi

          # --- Deterministic schedule -> route-path dispatch table -------------------
          # Exact string equality only (never a glob/case match against a
          # cron expression). Every path mapped to a firing schedule is
          # invoked -- never just one of several sharing the same tick.
          ROUTES=""
          if [ "${SCHEDULE}" = "0 * * * *" ]; then
            ROUTES="/api/internal/reviews/process-deadlines /api/internal/affiliate/review-and-approve"
          elif [ "${SCHEDULE}" = "*/10 * * * *" ]; then
            ROUTES="/api/internal/expire-unpaid-bookings /api/internal/expire-marketplace-requests"
          elif [ "${SCHEDULE}" = "*/20 * * * *" ]; then
            ROUTES="/api/internal/email/send-payment-reminders"
          elif [ "${SCHEDULE}" = "10 * * * *" ]; then
            ROUTES="/api/internal/email/retry-failed"
          elif [ "${SCHEDULE}" = "15 * * * *" ]; then
            ROUTES="/api/internal/affiliate/queue-payouts"
          elif [ "${SCHEDULE}" = "30 * * * *" ]; then
            ROUTES="/api/internal/affiliate/process-payouts"
          elif [ "${SCHEDULE}" = "0 */4 * * *" ]; then
            ROUTES="/api/internal/affiliate/reconcile-refunds /api/internal/commissions/reconcile-refunds"
          elif [ "${SCHEDULE}" = "20 * * * *" ]; then
            ROUTES="/api/internal/commissions/finalize-earned"
          elif [ "${SCHEDULE}" = "5 * * * *" ]; then
            ROUTES="/api/internal/payouts/reconcile-missing"
          elif [ "${SCHEDULE}" = "10 */6 * * *" ]; then
            ROUTES="/api/internal/payouts/reconcile"
          elif [ "${SCHEDULE}" = "40 * * * *" ]; then
            ROUTES="/api/internal/rent-to-buy/finalize-due-ownership"
          elif [ "${SCHEDULE}" = "50 * * * *" ]; then
            ROUTES="/api/internal/subscriptions/apply-due"
          elif [ "${SCHEDULE}" = "45 * * * *" ]; then
            ROUTES="/api/internal/subscriptions/execute-scheduled-publications"
          elif [ "${SCHEDULE}" = "0 */2 * * *" ]; then
            ROUTES="/api/internal/advertising/finalize-expired"
          else
            echo "Unrecognized schedule '${SCHEDULE}' -- no route mapped. Refusing to proceed."
            exit 1
          fi

          # Exactly ONE bounded request against one route -- no retry, on
          # ANY outcome (transport failure, timeout, or any HTTP status,
          # 2xx included). Never verbose -- the Authorization header must
          # never reach the log. No -L: never follow a redirect, so the
          # bearer secret can never leak to a different host. Body -> file
          # (never echoed -- avoids logging response fields that may carry
          # identifiers such as agreement/commission/booking ids), HTTP
          # status -> stdout. Returns 0 on success, 1 on failure. Never
          # exits the script -- callers must keep going so one route's
          # failure never prevents an unrelated route (sharing the same
          # tick) from being attempted.
          invoke_route() {
            local route="$1"
            local body_file
            body_file="$(mktemp)"
            local http_code=""
            local curl_exit=0

            http_code=$(curl -sS -X POST \
              --max-time 120 \
              -H "Authorization: Bearer ${INTERNAL_CRON_SECRET}" \
              -H 'Accept: application/json' \
              -o "${body_file}" \
              -w '%{http_code}' \
              "${INTERNAL_CRON_BASE_URL}${route}") && curl_exit=0 || curl_exit=$?

            if [ "${curl_exit}" -ne 0 ]; then
              echo "[${route}] transport failure or timeout (curl exit ${curl_exit}). Not retrying -- the server may already have started processing."
              rm -f "${body_file}"
              return 1
            fi

            case "${http_code}" in
              200)
                if ! jq -e . "${body_file}" >/dev/null 2>&1; then
                  echo "[${route}] HTTP 200 but the response body is not valid JSON."
                  rm -f "${body_file}"
                  return 1
                fi
                echo "[${route}] HTTP 200 OK."
                rm -f "${body_file}"
                return 0
                ;;
              401)
                echo "[${route}] HTTP 401 Unauthorized -- INTERNAL_CRON_SECRET does not match the deployed app."
                rm -f "${body_file}"
                return 1
                ;;
              503)
                echo "[${route}] HTTP 503 -- endpoint reports it is not configured."
                rm -f "${body_file}"
                return 1
                ;;
              *)
                echo "[${route}] unexpected HTTP ${http_code}. Not retrying -- the server may already have started processing."
                rm -f "${body_file}"
                return 1
                ;;
            esac
          }

          # --- Invoke every route mapped to this tick, independently -----------------
          FAILED=0
          for route in ${ROUTES}; do
            if invoke_route "${route}"; then
              echo "[${route}] OK"
            else
              echo "::error::[${route}] failed for schedule '${SCHEDULE}'"
              FAILED=1
            fi
          done

          if [ "${FAILED}" -eq 1 ]; then
            echo "One or more routes failed for schedule '${SCHEDULE}'."
            exit 1
          fi

          echo "All routes for schedule '${SCHEDULE}' completed cleanly."
